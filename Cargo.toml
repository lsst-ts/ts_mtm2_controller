[package]
name = "run_m2"
version = "0.5.6"
edition = "2021"
build = "build.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[features]
fpga = ["dep:nifpga-dll"]
realtime = ["dep:libc"]

[dependencies]
ts_control_utils = { git = "https://github.com/lsst-ts/ts_control_utils.git", branch = "develop" }
nifpga-dll = { version = "0.4.0", optional = true }
libc = { version = "0.2.186", optional = true}
approx = "0.5"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["cargo"] }
csv = "1.4.0"
kiddo = "5.3.1"
log = "0.4.29"
nalgebra = { version = "0.34.2", features = ["serde-serialize"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"
strum = "0.28.0"
strum_macros = "0.28.0"
tempfile = "3.27.0"
time = "0.3.47"
crc = "3.4.0"
fixed = "1.31.0"
flexi_logger = { version = "0.31.9", features = ["async", "specfile"] }
rmp-serde = "1.3.1"

[[bin]]
name = "test_fpga"
path = "src/bin/test_fpga.rs"
required-features = ["fpga"]
